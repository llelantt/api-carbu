<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Carburants — Essence la moins chère</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="wrap">
<h1>⛽ API Carburants</h1>
<p class="sub">Trouve l'essence la moins chère près de chez toi</p>
<form id="f">
<label>Code postal<input id="cp" inputmode="numeric" maxlength="5" placeholder="Ex : 77270" value="77270" required></label>
<label>Carburant<select id="carb">
<option value="gazole">Gazole</option><option value="sp95">SP95</option>
<option value="e10" selected>E10</option><option value="sp98">SP98</option>
<option value="e85">E85</option><option value="gplc">GPLc</option>
</select></label>
<button type="submit">Rechercher</button>
<button type="button" id="loc">Me localiser</button>
<div id="geo" style="width:100%;display:none;gap:8px;align-items:center;flex-wrap:wrap">
<label style="flex:1;min-width:140px">Rayon<select id="dist" style="flex:none;min-width:0"><option value="5">5 km</option><option value="10" selected>10 km</option><option value="20">20 km</option><option value="30">30 km</option></select></label>
<span>Position détectée ·</span>
<a href="#" id="unclear" style="color:var(--muted)">Effacer</a>
</div>
<div class="row">
<label>Plein (litres)<input id="vo" type="number" step="1" min="0" value="50"></label>
<label>Conso (L/100 km)<input id="co" type="number" step="0.1" min="0" value="6.5"></label>
</div>
<label style="width:100%;display:flex;gap:8px;align-items:center;cursor:pointer;color:var(--muted)"><input id="dt" type="checkbox" style="flex:none;width:auto;min-width:0"> Ça vaut le détour</label>
<div id="dopts" style="width:100%;gap:8px;flex-wrap:wrap;display:none">
<input id="kp" type="number" step="0.1" min="0" placeholder="Km station proche (A/R)">
<input id="kl" type="number" step="0.1" min="0" placeholder="Km station loin (A/R)">
</div>
</form>
<div class="cards" id="cards" hidden>
<div class="card"><div class="label">Prix moyen</div><div class="val" id="c-moy">—</div></div>
<div class="card hl"><div class="label">Moins cher</div><div class="val" id="c-min">—</div></div>
<div class="card"><div class="label">Plus cher</div><div class="val" id="c-max">—</div></div>
</div>
<p id="msg"></p>
<div class="st" id="detour" hidden style="border:2px solid var(--accent);margin-bottom:10px"></div>
<div class="st" id="notif" hidden style="border:2px solid #f59e0b;margin-bottom:10px"></div>
<div class="st" id="prev" hidden style="border:2px solid #2563eb;margin-bottom:10px"></div>
<div id="map"></div>
<div class="tabs" role="group" aria-label="Trier par">
<button type="button" data-s="tot" aria-pressed="true">Coût réel</button>
<button type="button" data-s="pr" aria-pressed="false">Prix au litre</button>
<button type="button" data-s="d" aria-pressed="false">Distance</button>
</div>
<div id="stations"></div>
<h2 style="margin-top:28px">Alertes prix</h2>
<p class="sub">Notifié quand le prix passe sous ton seuil dans ta zone.</p>
<form id="fa">
<input id="seuil" type="number" step="0.001" min="0" placeholder="Seuil €/L (ex : 1.80)" required>
<button type="submit">M'alerter</button>
</form>
<p id="msga"></p>
<div id="alertes" style="display:grid;gap:8px"></div>
</div>
<script>
const f=document.getElementById('f'),msg=document.getElementById('msg'),
box=document.getElementById('stations'),cards=document.getElementById('cards');
let pos=null,lastStations=[];
document.getElementById('loc').addEventListener('click',()=>{
if(!navigator.geolocation){msg.textContent='Géolocalisation non supportée.';msg.className='err';return;}
msg.textContent='Localisation…';msg.className='';
navigator.geolocation.getCurrentPosition(p=>{
pos={lat:+p.coords.latitude.toFixed(4),lon:+p.coords.longitude.toFixed(4)};
document.getElementById('cp').disabled=true;
document.getElementById('geo').style.display='flex';
msg.textContent='Position détectée, clique Rechercher.';msg.className='';
},()=>{msg.textContent='Position refusée ou indisponible.';msg.className='err';});
});
document.getElementById('unclear').addEventListener('click',e=>{e.preventDefault();
pos=null;document.getElementById('cp').disabled=false;
document.getElementById('geo').style.display='none';});
const zoneP=()=>pos?`lat=${pos.lat}&lon=${pos.lon}&dist=${document.getElementById('dist').value}`:`cp=${encodeURIComponent(document.getElementById('cp').value.trim())}`;
const zoneL=()=>pos?`autour de moi (${document.getElementById('dist').value} km)`:document.getElementById('cp').value.trim();
const affBadge=a=>{const c={fluide:'fl','modérée':'mo',dense:'de','fermé':'fe'}[a.niveau]||'fe';
const t=a.niveau==='fermé'?'Fermé':`${a.ouvert===false?'Fermé · ':a.ouvert?'Ouvert · ':''}Affluence ${a.niveau}`;
return `<span class="badge ${c}">${t}</span>`;};
const navLinks=x=>{
const dest=(x.lat!=null&&x.lon!=null)?`${x.lat},${x.lon}`:encodeURIComponent(`${x.adresse||''} ${x.ville||''}`);
const u={w:`https://waze.com/ul?ll=${dest}&navigate=yes`,g:`https://www.google.com/maps/dir/?api=1&destination=${dest}`,p:`https://maps.apple.com/?daddr=${dest}`};
return `Y aller : <a href="${u.w}" target="_blank" rel="noopener">Waze</a><a href="${u.g}" target="_blank" rel="noopener">Google Maps</a><a href="${u.p}" target="_blank" rel="noopener">Plans</a>`;};
const pf=n=>Number(n).toFixed(3).replace('.',',');
const pf2=n=>Number(n).toFixed(2).replace('.',',');
let sort='tot',lastS=null,lastT=null,lastMax=0,lastL=50;
function sortedStations(){
const a=[...lastS];
if(sort==='pr')a.sort((x,y)=>x.prix-y.prix);
else if(sort==='d')a.sort((x,y)=>(x.distance_km??1e9)-(y.distance_km??1e9));
else a.sort((x,y)=>(x.total_cost??1e9)-(y.total_cost??1e9));
return a;}
function renderList(){
const arr=sortedStations(),mn=lastT.min;
box.innerHTML=arr.map((x,i)=>`
<div class="st" data-i="${i}"><div class="top"><span class="rk">${i+1}</span><span class="prix">${pf(x.prix)}<small>€/L</small></span>
${x.prix===mn?'<span class="badge">Meilleur prix</span>':''}</div>
<div><b>${x.adresse||'Adresse inconnue'}</b></div>
<div class="addr">${x.ville||''}${x.distance_km!=null?` · à ${String(x.distance_km).replace('.',',')} km`:''} · ${x.date?new Date(x.date).toLocaleDateString('fr-FR'):''}${x.jours!=null?` · il y a ${x.jours} j`:''}</div>
<div class="fiab">${x.perime?`<span class="badge old">Prix vieux de ${x.jours} j</span>`:''}${x.rupture?`<span class="badge rup">Rupture ${x.rupture}</span>`:''}${x.affluence?affBadge(x.affluence):''}</div>
<div class="tot">Plein ${lastL} L : ${pf2(x.total_cost)} €${x.distance_km!=null?' détour inclus':''}</div>
<div class="eco">${x.prix===mn?'—':`Économie : ${pf2((lastMax-x.prix)*lastL)} € sur un plein de ${lastL} L`}</div>
<div class="itin" hidden>${navLinks(x)}</div>
</div>`).join('');
box.querySelectorAll('.st').forEach(el=>el.addEventListener('click',e=>{
if(e.target.closest('a'))return;
el.querySelector('.itin').hidden=!el.querySelector('.itin').hidden;}));
showMap(arr);}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{
sort=b.dataset.s;
document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',x===b));
if(lastS)renderList();}));
let map=null,layer=null;
function showMap(stations){
const el=document.getElementById('map');
const pts=stations.filter(x=>x.lat!=null&&x.lon!=null);
if(!pts.length){el.hidden=true;return;}
if(!window.L){el.hidden=false;
el.innerHTML='<p class="addr" style="padding:16px">Carte indisponible : connexion internet requise pour charger le fond de carte.</p>';return;}
el.hidden=false;
if(!map){map=L.map('map');L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);}
if(layer)layer.clearLayers();else layer=L.layerGroup().addTo(map);
const pill=(p,best)=>L.divIcon({className:'',html:`<div style="background:${best?'#16a34a':'#fff'};color:${best?'#fff':'#1f2937'};border:2px solid ${best?'#16a34a':'#6b7280'};border-radius:999px;padding:2px 8px;font-weight:800;font-size:12px;white-space:nowrap">${p.toFixed(2).replace('.',',')} €</div>`});
const bounds=[];
pts.forEach((x,i)=>{bounds.push([x.lat,x.lon]);
L.marker([x.lat,x.lon],{icon:pill(x.prix,i===0)}).addTo(layer)
.bindPopup(`<b>${pf(x.prix)} €</b><br>${x.adresse||''}<br>${x.ville||''}`);});
if(pos){bounds.push([pos.lat,pos.lon]);
L.circleMarker([pos.lat,pos.lon],{radius:8,color:'#2563eb',fillColor:'#2563eb',fillOpacity:1}).addTo(layer).bindPopup('Toi');}
map.fitBounds(bounds,{padding:[30,30]});
setTimeout(()=>map.invalidateSize(),100);
}
function initMap(){
if(window.L){map=L.map('map').setView([46.6,2.4],6);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);}
else{const s=document.createElement('script');
s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
s.onload=initMap;
s.onerror=()=>{document.getElementById('map').innerHTML='<p class="addr" style="padding:16px">Carte indisponible : connexion internet requise pour charger le fond de carte.</p>';};
document.head.appendChild(s);}
}
initMap();
document.getElementById('dt').addEventListener('change',e=>{
document.getElementById('dopts').style.display=e.target.checked?'flex':'none';});
f.addEventListener('submit',async e=>{
e.preventDefault();
const carb=document.getElementById('carb').value,
useD=document.getElementById('dt').checked,
kp=document.getElementById('kp').value,kl=document.getElementById('kl').value,
co=document.getElementById('co').value||'6.5',vo=document.getElementById('vo').value||'50';
if(!pos&&!document.getElementById('cp').value.trim()){msg.textContent='Indique un code postal ou localise-toi.';msg.className='err';return;}
box.innerHTML='';cards.hidden=true;document.getElementById('detour').hidden=true;
document.getElementById('notif').hidden=true;document.getElementById('prev').hidden=true;
document.getElementById('map').hidden=true;
msg.textContent='Chargement…';msg.className='';
let zl='',zcp='';
try{
let url=`/stations?${zoneP()}&carburant=${carb}`;
if(useD&&kp!==''&&kl!=='')url+=`&km_proche=${encodeURIComponent(kp)}&km_loin=${encodeURIComponent(kl)}&conso=${co}&plein=${vo}`;
const [rS,rT,rP]=await Promise.all([fetch(url),fetch(`/stats?${zoneP()}&carburant=${carb}`),fetch(`/prevision?${zoneP()}&carburant=${carb}`)]);
const s=await rS.json(),t=await rT.json();
if(!rS.ok){const rl=(s.ruptures||[]).map(r=>`${r.adresse||'adresse inconnue'} (${r.ville||''})`).join(', ');
throw new Error((s.detail||'Erreur')+(rl?` Ruptures : ${rl}.`:''));}
try{const p=await rP.json();
if(rP.ok){const el=document.getElementById('prev');el.hidden=false;
el.innerHTML=`<b>${p.conseil}</b><br><span class="addr">Tendance 7 j : ${p.tendance} (${p.variation>=0?'+':''}${pf(p.variation)} €) · ${p.points} relevé(s)</span>`;}}catch{}
document.getElementById('c-moy').textContent=pf(t.moyenne)+' €';
document.getElementById('c-min').textContent=pf(t.min)+' €';
document.getElementById('c-max').textContent=pf(t.max)+' €';
cards.hidden=false;lastStations=s.stations;
zl=zoneL();zcp=pos?(s.stations[0].cp||'') :document.getElementById('cp').value.trim();
msg.textContent=`${t.nombre} station(s) — ${zl} · ${carb.toUpperCase()}`;
const max=t.max,per=s.prix_perimes||0,rup=(s.ruptures||[]).length;
const ouv=s.stations.filter(x=>x.affluence&&x.affluence.ouvert).length;
if(per||rup)msg.textContent+=` · ${per?per+' prix de + de 7 j':''}${per&&rup?' · ':''}${rup?rup+' station(s) en rupture':''}`;
msg.textContent+=` · ${ouv}/${s.stations.length} ouverte(s)`;
if(s.detour){const d=s.detour,el=document.getElementById('detour'),lo=d.station_loin;
el.hidden=false;
el.innerHTML=`<b>${d.vaut_le_coup?'✅':'❌'} ${d.message}</b><br><span class="addr">${lo.adresse||''} · ${lo.ville||''} · à ${String(lo.distance_km).replace('.',',')} km · Plein : <span class="led sm">${pf2(lo.total_cost)} €</span> détour inclus · Économie vs plus proche : <span class="led sm">${d.economy_vs_nearest>=0?'+':''}${pf2(d.economy_vs_nearest)} €</span></span>`;}
lastS=s.stations;lastT=t;lastMax=t.max;lastL=+vo||50;
renderList();
}catch(err){msg.textContent=err.message;msg.className='err';}
checkAlertes(zcp,carb);
});
const fa=document.getElementById('fa'),msga=document.getElementById('msga'),
alBox=document.getElementById('alertes');
const getA=()=>{try{return JSON.parse(localStorage.getItem('alertes')||'[]')}catch{return[]}};
const setA=a=>localStorage.setItem('alertes',JSON.stringify(a));
function renderA(){
const a=getA();
alBox.innerHTML=a.length?a.map((x,i)=>`<div class="st"><div class="top"><b>${x.cp} · ${x.carburant.toUpperCase()} · ≤ ${pf(x.seuil)} €</b><button data-i="${i}" style="padding:4px 12px">✕</button></div></div>`).join(''):'<span class="addr">Aucune alerte.</span>';
alBox.querySelectorAll('button').forEach(b=>b.onclick=()=>{const l=getA();l.splice(+b.dataset.i,1);setA(l);renderA();});
}
async function checkAlertes(cp,carb){
const list=getA().filter(x=>x.cp===cp&&x.carburant===carb),el=document.getElementById('notif');
el.hidden=true;if(!list.length||!cp)return;
for(const a of list){
try{
const r=await fetch(`/alertes/check?${zoneP()}&carburant=${carb}&seuil=${a.seuil}`),d=await r.json();
if(r.ok&&d.declenchee){
el.hidden=false;
el.innerHTML=`<b>🔔 Alerte prix : ${pf(d.min)} € ≤ ${pf(a.seuil)} € (${cp} · ${carb.toUpperCase()})</b>`;
if('Notification' in window&&Notification.permission==='granted')new Notification('Prix sous le seuil',{body:`${carb.toUpperCase()} à ${pf(d.min)} € (${cp})`});
break;}
}catch{}
}
}
fa.addEventListener('submit',async e=>{
e.preventDefault();
const carb=document.getElementById('carb').value,
seuil=parseFloat(document.getElementById('seuil').value);
const cp=pos?((lastStations[0]||{}).cp||'') :document.getElementById('cp').value.trim();
if(!cp){msga.textContent='Lance d\u2019abord une recherche pour fixer la zone.';msga.className='err';return;}
if(!(seuil>0)){msga.textContent='Seuil invalide.';msga.className='err';return;}
if('Notification' in window&&Notification.permission==='default')await Notification.requestPermission();
const l=getA();
if(!l.some(x=>x.cp===cp&&x.carburant===carb&&+x.seuil===seuil))l.push({cp,carburant:carb,seuil});
setA(l);renderA();msga.textContent=`Alerte créée : ${cp} · ${carb.toUpperCase()} ≤ ${pf(seuil)} €.`;msga.className='';
checkAlertes(cp,carb);
});
renderA();
f.requestSubmit();
</script>
</body>
</html>
