<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Carburants — Essence la moins chère</title>
<link rel="stylesheet" href="/static/vendor/leaflet.css">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="wrap">
<h1>⛽ API Carburants</h1>
<p class="sub">Trouve l'essence la moins chère près de chez toi</p>
<form id="f">
<label>Code postal<input id="cp" inputmode="numeric" maxlength="5" placeholder="Ex : 75001" required></label>
<label>Carburant<select id="carb" required>
<option value="" selected>Choisir</option>
<option value="gazole">Gazole</option><option value="sp95">SP95</option>
<option value="e10">E10</option><option value="sp98">SP98</option>
<option value="e85">E85</option><option value="gplc">GPLc</option>
</select></label>
<label>Rayon max (km)<input id="dist" type="number" min="1" max="100" step="1" placeholder="Ex : 10"></label>
<button type="submit">Rechercher</button>
<button type="button" id="loc">Me localiser</button>
<div id="geo">
<span>Position détectée ·</span>
<a href="#" id="unclear">Effacer</a>
</div>
<div class="row">
<label>Plein (litres)<input id="vo" type="number" step="1" min="0" value="50"></label>
<label>Conso (L/100 km)<input id="co" type="number" step="0.1" min="0" value="6.5"></label>
</div>
<label class="checkline"><input id="dt" type="checkbox"> Ça vaut le détour</label>
<div id="dopts">
<input id="kp" type="number" step="0.1" min="0" placeholder="Km station proche (A/R)">
<input id="kl" type="number" step="0.1" min="0" placeholder="Km station loin (A/R)">
</div>
</form>
<div class="cards" id="cards" hidden>
<div class="card"><div class="label">Prix moyen</div><div class="val" id="c-moy">—</div></div>
<div class="card hl"><div class="label">Moins cher</div><div class="val" id="c-min">—</div></div>
<div class="card"><div class="label">Plus cher</div><div class="val" id="c-max">—</div></div>
</div>
<p id="msg"></p>
<div class="st bd-green" id="detour" hidden></div>
<div class="st bd-amber" id="notif" hidden></div>
<div class="st bd-blue" id="prev" hidden></div>
<div id="map" hidden></div>
<p id="mapwarn" class="addr" hidden></p>
<div class="tabs" id="sortTabs" role="group" aria-label="Trier par">
<button type="button" data-s="tot" aria-pressed="true">Coût réel</button>
<button type="button" data-s="pr" aria-pressed="false">Prix au litre</button>
<button type="button" data-s="d" aria-pressed="false">Distance</button>
</div>
<div id="stations"></div>
<h2>Alertes prix</h2>
<p class="sub">Notifié quand le prix passe sous ton seuil dans ta zone.</p>
<form id="fa">
<label>Carburant<select id="a-carb">
<option value="gazole">Gazole</option><option value="sp95">SP95</option>
<option value="e10" selected>E10</option><option value="sp98">SP98</option>
<option value="e85">E85</option><option value="gplc">GPLc</option>
</select></label>
<label>Seuil (€/L)<input id="seuil" type="number" step="0.001" min="0" placeholder="Ex : 1,80" required><small class="ferr" id="e-seuil"></small></label>
<label>Zone (code postal)<input id="a-cp" inputmode="numeric" maxlength="5" placeholder="Ex : 77270" required><small class="ferr" id="e-cp"></small></label>
<button type="submit">M'alerter</button>
</form>
<p id="msga"></p>
<div id="alertes"></div>
</div>
<script src="/static/vendor/leaflet.js"></script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
